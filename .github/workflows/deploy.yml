name: Testar e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Testes do motor
        run: npm test
      - name: Build
        run: npm run build
      - name: Navegador para os testes de ponta a ponta
        run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
      # Pages serve o site em /<repo>/: caminhos absolutos e o service worker restrito à raiz do app
      - name: Build para o GitHub Pages
        if: github.event_name != 'pull_request'
        run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}/
      # Publica no branch gh-pages (Pages: "Deploy from a branch" → gh-pages / root), o mesmo que
      # `npm run publish:pages` faz à mão quando o Actions não está disponível
      - name: Publicar no gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publica o Mundial de Clubes 64 (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages:gh-pages
